<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Evergreen Preschool</title>
  <style>
    body { font-family: 'Quicksand', sans-serif; background: #FEFCF8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 40px 30px; max-width: 320px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #178F78; margin: 0 0 8px; }
    p { font-size: 14px; color: #6B7A99; margin: 0 0 24px; line-height: 1.6; }
    button { background: #178F78; color: white; border: none; border-radius: 20px; padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1>You're Offline</h1>
    <p>No internet connection right now. Please check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
